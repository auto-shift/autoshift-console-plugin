# Accepted vulnerabilities, reviewed and justified.
#
# YAML rather than the plain .trivyignore format on purpose: only this format supports expired_at,
# and Trivy enforces it (pkg/result/ignore.go, IgnoreFindings.Prune drops an entry once the date
# passes, so the finding fails the gate again). The plain format discards # comments entirely, so a
# "revisit by" date written there is read by humans and nothing else — a suppression added once
# would live forever, silently hiding a later regression of the same CVE.
#
# Every entry needs an id, a statement saying why it does not apply here, and an expired_at.
# Unlike a comment, `statement` also reaches the JSON and SARIF output.
#
# Keep expired_at short. It is a review deadline, not an estimate of when the fix lands: the cost of
# it expiring early is one red build, and the cost of it expiring late is a real CVE going unnoticed.
#
# The gate already runs with ignore-unfixed, so an unfixed CVE never reaches this file — there is
# nothing to action until Red Hat ships a fix, and the weekly scan of the published image reports
# those separately. This file is only for a FIXABLE HIGH/CRITICAL that genuinely does not apply.

vulnerabilities:
  - id: CVE-2026-63382
    statement: >-
      libevent 2.1.12-8.el9_4 is inherited from the ubi9/nginx-126 base, which Red Hat has not yet rebuilt with the fixed 2.1.13-1.el9_8. Nothing in the image reaches it: nginx does not link libevent, and its only consumer is openldap (libldap/liblber), which nginx does not load. The CVEs are in libevent's evhttp/evrpc/evtag code. Remove once the base carries 2.1.13-1.el9_8.
    expired_at: 2026-10-05
