# Accepted vulnerabilities, reviewed and justified.
#
# YAML rather than the plain .trivyignore format on purpose: only this format supports expired_at,
# and Trivy enforces it (pkg/result/ignore.go, IgnoreFindings.Prune drops an entry once the date
# passes, so the finding fails the gate again). The plain format discards # comments entirely, so a
# "revisit by" date written there is read by humans and nothing else — a suppression added once
# would live forever, silently hiding a later regression of the same CVE.
#
# Every entry needs an id, a statement saying why it does not apply here, and an expired_at.
# Unlike a comment, `statement` also reaches the JSON and SARIF output.
#
# Keep expired_at short. It is a review deadline, not an estimate of when the fix lands: the cost of
# it expiring early is one red build, and the cost of it expiring late is a real CVE going unnoticed.
#
# The gate already runs with ignore-unfixed, so an unfixed CVE never reaches this file — there is
# nothing to action until Red Hat ships a fix, and the weekly scan of the published image reports
# those separately. This file is only for a FIXABLE HIGH/CRITICAL that genuinely does not apply.


# libxml2 (CVE-2026-74860, CVE-2026-86140): fixed in RHEL as 2.9.13-14.el9_8.5, but no nginx-126 base
# ships it yet. Drop these entries once the pinned base carries it, rather than extending expired_at.
vulnerabilities:
  - id: CVE-2026-74860
    statement: >-
      libxml2 2.9.13-14.el9_8.4 is inherited from the ubi9/nginx-126 base, which Red Hat has not yet rebuilt with the fixed 2.9.13-14.el9_8.5. Nothing in the running pod reaches it: nginx links libxml2 only through ngx_http_xslt_filter_module, which the base config loads but the nginx.conf the Helm chart mounts over it does not (it has no load_module), and the pod serves static assets with no xslt_stylesheet. Its other consumers are dnf/librepo, libarchive and gettext, none of which the pod runs. This one is also confined to the libxml2 Python bindings, which the image does not install. Remove once the base carries 2.9.13-14.el9_8.5.
    expired_at: 2026-10-06
  - id: CVE-2026-86140
    statement: >-
      libxml2 2.9.13-14.el9_8.4 is inherited from the ubi9/nginx-126 base, which Red Hat has not yet rebuilt with the fixed 2.9.13-14.el9_8.5. Nothing in the running pod reaches it: nginx links libxml2 only through ngx_http_xslt_filter_module, which the base config loads but the nginx.conf the Helm chart mounts over it does not (it has no load_module), and the pod serves static assets with no xslt_stylesheet. Its other consumers are dnf/librepo, libarchive and gettext, none of which the pod runs. Remove once the base carries 2.9.13-14.el9_8.5.
    expired_at: 2026-10-06
