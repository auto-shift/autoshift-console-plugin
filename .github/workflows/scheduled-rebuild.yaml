name: Scheduled Rebuild and Scan

# An image does not stay clean by standing still. Red Hat patches the UBI bases continuously, so
# the released plugin is rebuilt weekly against the current bases even when no plugin code has
# changed — the code is identical, the OS packages are not.
#
# The second job scans what is already published. That is the one that catches a CVE disclosed
# after release, which no build-time gate can ever see.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE: quay.io/autoshift/autoshift-console-plugin

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          echo "matrix=$(jq -c '{ocp: (.targets | keys)}' ocp-targets.json)" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rebuild the RELEASED code, not main: this job exists to refresh base packages, not to ship
      # unreleased changes. If there is no release tag yet there is nothing to refresh.
      - name: Resolve latest release tag
        id: tag
        run: |
          TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No release tag found — nothing to rebuild."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        if: steps.tag.outputs.found == 'true'
        run: git checkout "${{ steps.tag.outputs.tag }}"

      # Resolve the CURRENT amd64 digest for each base rather than using the Dockerfile's pinned
      # value — that pin is what makes ordinary builds reproducible, and this job is explicitly
      # the one allowed to move past it.
      - name: Resolve current base image digests
        if: steps.tag.outputs.found == 'true'
        id: bases
        run: |
          resolve() {
            curl -sS --max-time 30 \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://registry.access.redhat.com/v2/$1/manifests/latest" \
            | python3 -c "
          import sys, json
          for m in json.load(sys.stdin).get('manifests', []):
              p = m.get('platform', {})
              if p.get('os') == 'linux' and p.get('architecture') == 'amd64':
                  print(m['digest']); break
          "
          }
          BUILDER=$(resolve ubi9/nodejs-22)
          RUNTIME=$(resolve ubi9/nginx-126)
          [ -n "$BUILDER" ] && [ -n "$RUNTIME" ] || { echo "could not resolve base digests"; exit 1; }
          echo "builder=${BUILDER}" >> "$GITHUB_OUTPUT"
          echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"
          echo "Builder: ${BUILDER}"
          echo "Runtime: ${RUNTIME}"

      # The Dockerfile pins bases as literal FROM lines so Dependabot can track them, which leaves
      # no --build-arg to override. Rewriting them here is the same override by other means: the
      # checkout is ephemeral and nothing is committed, so the repo pin still moves only by PR.
      - name: Repin bases to current digests
        if: steps.tag.outputs.found == 'true'
        env:
          BUILDER: ${{ steps.bases.outputs.builder }}
          RUNTIME: ${{ steps.bases.outputs.runtime }}
        run: |
          # The optional :tag group matters: this job checks out the released tag, and releases cut
          # before the FROM lines were retagged carry the bare image@sha256 form.
          sed -i -E "s|(ubi9/nodejs-22(:[^@[:space:]]+)?@)sha256:[0-9a-f]{64}|\1${BUILDER}|" Dockerfile
          sed -i -E "s|(ubi9/nginx-126(:[^@[:space:]]+)?@)sha256:[0-9a-f]{64}|\1${RUNTIME}|" Dockerfile
          # A sed that matches nothing still exits 0. Without this check a renamed base or a
          # reformatted FROM line would rebuild against the stale pin and report a clean refresh
          # that refreshed nothing — the exact failure this job exists to prevent.
          grep -q "${BUILDER}" Dockerfile || { echo "builder repin did not apply"; exit 1; }
          grep -q "${RUNTIME}" Dockerfile || { echo "runtime repin did not apply"; exit 1; }
          grep -n '^FROM' Dockerfile

      - uses: actions/setup-node@v5
        if: steps.tag.outputs.found == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Select OpenShift target and build assets
        if: steps.tag.outputs.found == 'true'
        run: |
          ./scripts/set-ocp-target.sh ${{ matrix.ocp }}
          YARN="node $(awk '/yarnPath:/{print $2}' .yarnrc.yml)"
          $YARN install --immutable
          $YARN build

      - uses: docker/setup-buildx-action@v4
        if: steps.tag.outputs.found == 'true'

      - name: Build against current bases
        if: steps.tag.outputs.found == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:rebuild-ocp${{ matrix.ocp }}
          build-args: |
            PLUGIN_VERSION=${{ steps.tag.outputs.tag }}-ocp${{ matrix.ocp }}
            PLUGIN_REVISION=${{ github.sha }}

      - name: Scan rebuilt image (gate)
        if: steps.tag.outputs.found == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:rebuild-ocp${{ matrix.ocp }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Log in to Quay
        if: steps.tag.outputs.found == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Published under a dated tag as well as the floating one, so a cluster can pin to a rebuild
      # and the release tag itself keeps meaning "the image originally cut for that version".
      - name: Push rebuild
        if: steps.tag.outputs.found == 'true'
        id: push
        run: |
          SRC="${{ env.IMAGE }}:rebuild-ocp${{ matrix.ocp }}"
          DATED="${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-ocp${{ matrix.ocp }}-${{ steps.tag.outputs.date }}"
          FLOATING="${{ env.IMAGE }}:ocp${{ matrix.ocp }}"
          docker tag "$SRC" "$DATED"; docker tag "$SRC" "$FLOATING"
          docker push "$DATED"; docker push "$FLOATING"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DATED" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: steps.tag.outputs.found == 'true'

      - name: Sign rebuild
        if: steps.tag.outputs.found == 'true'
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

  # Reports on the image that is actually deployed, including CVEs with no fix available. This
  # never gates anything — it opens an issue so the exposure is visible and tracked.
  #
  # Ordered after the rebuild so it scans what that job just pushed. Run in parallel it raced the
  # push and always graded last week's image, which meant a rebuild was never checked after the
  # fact. always() keeps the report alive when the rebuild fails its gate — that is precisely the
  # week the published image is stale and someone needs to be told.
  scan-published:
    needs: [targets, rebuild]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Two scans, because they answer different questions. The gate-equivalent scan (fixable
      # only) should be empty if the rebuild above did its job; anything there is a real problem.
      # The full scan is informational — a UBI base carries a standing tail of unfixed CVEs
      # (17 HIGH at the time of writing) and opening an issue for those every week would be noise
      # that trains people to ignore the label.
      - name: Scan published image (fixable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ocp${{ matrix.ocp }}
          format: table
          output: fixable.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore.yaml

      - name: Scan published image (full exposure)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ocp${{ matrix.ocp }}
          format: json
          output: full.json
          ignore-unfixed: false
          exit-code: '0'

      - name: Summarise exposure
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          d = json.load(open('full.json'))
          total, fixable = collections.Counter(), collections.Counter()
          for r in d.get('Results', []):
              for v in r.get('Vulnerabilities') or []:
                  total[v['Severity']] += 1
                  if v.get('FixedVersion'):
                      fixable[v['Severity']] += 1
          print('### Published image exposure\n')
          print('| Severity | Total | Fixable |')
          print('|---|---|---|')
          for s in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']:
              if total[s]:
                  print(f'| {s} | {total[s]} | {fixable[s]} |')
          print(f'\nFixable total: **{sum(fixable.values())}**')
          PY

      - name: Report fixable findings
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('fixable.txt', 'utf8').trim();
            // Trivy draws its table with box characters, so the severity words are the only
            // reliable signal that a row exists. (An earlier version matched on '|' and silently
            // reported clean.)
            const clean = !/\b(HIGH|CRITICAL)\b/.test(report);
            const title = 'Published image (ocp${{ matrix.ocp }}): fixable HIGH/CRITICAL vulnerabilities';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'security',
            });
            const existing = issues.find((i) => i.title === title);

            if (clean) {
              core.notice('No fixable HIGH/CRITICAL in the published image.');
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: 'No fixable HIGH/CRITICAL in the latest scheduled scan — closing.',
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              `Scheduled scan of \`${{ env.IMAGE }}:ocp${{ matrix.ocp }}\` found **fixable** HIGH/CRITICAL`,
              'vulnerabilities. A fix exists upstream, so the weekly rebuild should have cleared',
              'these — check whether that job is failing.',
              '',
              '```',
              report.slice(0, 60000),
              '```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['security'],
              });
            }
